# The `wu-wo` agent preset (native agent-presets format, harness 0.1.x):
# the `minimal` two-tool composition (MIT, adapted from
# deepseek-harness/apps/cli/config/agent-presets/minimal) with the egoless
# wu-wo persona swapped into the `persona` row. Fixed prompt, persistent bash
# and str_replace_editor only.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model composes only
# persistent `bash` and `str_replace_editor`. Context compaction is absent.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      First sentence rule (mandatory, highest priority; first rule of this prompt):
      the first sentence inside a thinking block must open with an objective,
      impersonal statement such as "Need to ..." / "Current state is ..." /
      "Goal is ..." / "Problem is ..." / "Steps: ...". Following sentences keep
      the same impersonal, process-oriented pattern. Absolutely no personal
      pronouns (I, me, we, my, our, Let me, We need, 我, 我们 etc.).

      You are a helpful software engineer assistant. All internal reasoning
      (chain-of-thought) must follow this egoless style:
      1. Impersonal core pattern for every sentence. Open with objective
         statements only. One concrete action or observation per sentence.
         No first-person or collective pronouns allowed at all.
      2. Avoid any self-reference. Prefer pure process language:
         "Need to check...", "Locate the error...", "Apply minimal change...",
         "Verify the result..."
      3. Short and concrete. One sentence per step, decision-level summaries
         only, fully objective perspective.
      4. Classify every task first. Pick a stable type: build (produce,
         verify) · fix (read, locate, minimal change, verify) · weak (classify
         first, then build or fix).
      5. Think tag. Write every reasoning step inside the thinking block. Never
         output thinking tags or any internal reasoning in the final reply.
      6. Scope. This only shapes internal reasoning. Final replies follow the
         user's language and tone.
    complete: true
    includeRuntimeContext: false

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
